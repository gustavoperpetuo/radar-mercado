name: Radar de Mercado

on:
  schedule:
    - cron: "0 10-22/4 * * 1-5"   # a cada hora, 07h-19h BRT, dias úteis (UTC-3)
  workflow_dispatch: {}          # permite rodar manualmente

permissions:
  contents: write                # necessário pra commitar sent_ids.json

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Rodar agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVOLUTION_BASE_URL: ${{ secrets.EVOLUTION_BASE_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCE: ${{ secrets.EVOLUTION_INSTANCE }}
          WHATSAPP_GROUP_JID: ${{ secrets.WHATSAPP_GROUP_JID }}
        run: python news_agent.py

      - name: Persistir estado de dedupe
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent_ids.json sent_today.json || true
          git diff --cached --quiet || git commit -m "update sent state [skip ci]"
          git push
